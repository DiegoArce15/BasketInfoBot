name: Daily Matches Sync

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --locked

      - name: Sync matches
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ACB_TARGET_URL: ${{ secrets.ACB_TARGET_URL }}
        run: uv run python -m src.infrastructure.in.cli.sync_matches